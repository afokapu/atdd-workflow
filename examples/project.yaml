schema: atdd-workflow/project/v1
project: example-app
repository: /Users/you/Github/example-app
worktree_root: /Users/you/Github/worktrees/example-app
roles:
  coordinator:
    address: coordinator@{project}
    branch: main
    worktree: "{repository}"
  driver:
    address: driver.{name}@{project}
    branch: delivery/{name}
    base: main
    worktree: "{worktree_root}/{name}"
groups:
  coordinators@example-app:
    role: coordinator
  drivers@example-app:
    role: driver
